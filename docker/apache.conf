ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    RewriteEngine On
    RewriteCond /var/moodledata/.hefesto-installed !-f
    RewriteCond %{REQUEST_URI} !^/healthz\.txt$
    RewriteRule ^ - [R=503,L]
    ErrorDocument 503 "Academia en preparacion."
    DocumentRoot /var/www/moodle/public
    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /r.php
    </Directory>
    <FilesMatch "^(install\.php|config\.php)$">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
