# =============================================================================
# Reciclaje de los hijos de Apache (mod_php): CVE-2026-109618 / CVE-2026-109619
# =============================================================================
#
# QUE HACE
# --------
# `MaxRequestsPerChild 100` hace que Apache termine el hijo que atiende PHP
# despues de 100 peticiones y levante uno nuevo. Un proceso de PHP comprometido
# deja de estar comprometido cuando muere.
#
# SIN ESTO
# --------
# Apache usa 1000 peticiones por hijo por omision, o sea que un hijo vulnerable
# vive diez veces mas.
#
# POR QUE VA EN `conf-available/` Y NO EN EL `sites-available/`
# ----------------------------------------------------
# `MaxRequestsPerChild` es una directiva de configuracion de SERVIDOR: dentro de
# un `<VirtualHost>` Apache no la acepta. `conf-available/` se incluye a nivel de
# servidor, que es donde vale.
#
# La imagen `php:8.3-apache-bookworm` trae `mpm_prefork`. El bloque esta
# repetido para `mpm_event` por si la imagen cambia de modulo.
#
# CVE-2026-109618 / CVE-2026-109619 - PHP2Shell - 2026-10-22
# -----------------------------------------------------------------------------

<IfModule mpm_prefork_module>
    MaxRequestsPerChild 100
</IfModule>

<IfModule mpm_event_module>
    MaxRequestsPerChild 100
</IfModule>
