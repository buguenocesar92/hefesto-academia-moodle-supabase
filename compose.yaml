x-moodle: &moodle
  build: .
  image: hefesto-academia-moodle:5.3
  restart: unless-stopped
  environment: &environment
    MOODLE_URL: ${MOODLE_URL:?Configura URL publica HTTPS}
    DB_HOST: ${DB_HOST:?Configura host PostgreSQL directo}
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-postgres}
    DB_USER: ${DB_USER:-moodle_app}
    DB_PASSWORD: ${DB_PASSWORD:?Configura password PostgreSQL}
    # DB_SSLMODE tiene precedencia; DB_SSL se conserva por compatibilidad
    # con .env antiguos cuyo nombre era DB_SSL.
    DB_SSLMODE: ${DB_SSLMODE:-${DB_SSL:-require}}
    # Opt-in explicito para sslmode inseguros (disable/allow/prefer). Por
    # defecto 0: solo require/verify-full pasan sin aviso.
    HEFESTO_ALLOW_INSECURE_DB: ${HEFESTO_ALLOW_INSECURE_DB:-0}
    PGSSLROOTCERT: /etc/ssl/certs/supabase-ca.crt
    MOODLE_BEHIND_PROXY: "1"
  volumes:
    - moodledata:/var/moodledata
    - ./certs:/etc/ssl/certs/custom:ro
services:
  web:
    <<: *moodle
    environment:
      <<: *environment
      PGSSLROOTCERT: /etc/ssl/certs/custom/supabase-ca.crt
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
  cron:
    <<: *moodle
    environment:
      <<: *environment
      PGSSLROOTCERT: /etc/ssl/certs/custom/supabase-ca.crt
    user: www-data
    command: ["/opt/hefesto/cron.sh"]
    depends_on:
      web:
        condition: service_healthy
  dbtools:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [tools]
    environment:
      PGHOST: ${DB_HOST:?Configura host PostgreSQL directo}
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-postgres}
      PGUSER: ${DB_USER:-moodle_app}
      PGPASSWORD: ${DB_PASSWORD:?Configura password PostgreSQL}
      PGSSLMODE: ${DB_SSLMODE:-require}
      PGSSLROOTCERT: /etc/ssl/certs/custom/supabase-ca.crt
    volumes:
      - ./certs:/etc/ssl/certs/custom:ro

volumes:
  moodledata:
